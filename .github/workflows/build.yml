name: Build
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_apk: "IraNtun"

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk: r28c

      - name: Prepare Android libs
        run: |
          mkdir -p android/app/libs
          curl -L https://github.com/hiddify/hiddify-next-core/releases/download/draft/hiddify-lib-android.tar.gz | tar xz -C android/app/libs/

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build runner
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          echo "Build runner completed"

      - name: Build Android APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=sentry_dsn=${SENTRY_DSN} \
            --dart-define=FLUTTER_BUILD_NAME=1.0.0 \
            --dart-define=FLUTTER_BUILD_NUMBER=1

      - name: Create ZIP Artifact
        run: |
          mkdir -p out
          ls -la build/app/outputs/flutter-apk/ || echo "No APK output"
          for f in build/app/outputs/flutter-apk/*arm64-v8a*.apk; do
            [ -f "$f" ] && cp "$f" out/${TARGET_NAME_apk}-arm64.apk
          done
          for f in build/app/outputs/flutter-apk/*armeabi-v7a*.apk; do
            [ -f "$f" ] && cp "$f" out/${TARGET_NAME_apk}-arm7.apk
          done
          cd out && zip IraNtun-Android-APK.zip *.apk && ls -la

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: ./out
          retention-days: 1